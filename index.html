<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>Designer Microcosms</title>
        <link rel="stylesheet" href="https://use.typekit.net/ehj2wkv.css">
        <link href="css/reset.css" rel="stylesheet" type="text/css" />
        <link href="css/flickity.css" rel="stylesheet" type="text/css">
        <link href="css/stylesInternalPage.css" rel="stylesheet" type="text/css" />
        <script type="text/javascript" src="js/jquery-3.6.0.min.js"></script>
        <script type="text/javascript" src="js/jquery.easing.1.3.js" ></script>
        <script type="text/javascript" src="js/flickity.pkgd.min.js" ></script>
    </head>
    <body>

        <header class="header">

            <div class="container headerContainer">
                
                <a class="backnforth back" href="#">
                    <div class="back arrow"></div>
                    <p>PREVIOUS</p>
                </a>

                <a class="identity" href="index.html"></a>

                <a class="backnforth forth" href="#">
                    <p>NEXT</p>
                    <div class="forward arrow"></div>
                </a>

            </div>

        </header>

        <div class="container content">

            <div class="designerPage">

                <div class="profileContainer">

                    <img class="designerPortrait" id="designerPortrait" src="">

                    <div class="profileDetails">
                        <h2 id="designerName"></h2>
                        <h4 id="designerBrand"></h4>
                    </div>

                    <div class="profileLinks">
                        <a id="designerWebsite"></a>
                        <a id="designerInstagram"></a>
                        <a id="designerLinkedin"></a>
                    </div>

                </div>

                <div class="Q1">
                    <h3>What COSM Do I Design In?</h3>
                    <p id="designerBio"></p>
                </div>

                <div class="Q2">
                    <h3>About <span class="designerBrand"></span></h3>
                    <p id="designerProject"></p>
                </div>

            </div>

            <div>
                <div class="main-carousel designerMockups">
                  <div class="carousel-cell" id="picOne"></div>
                  <div class="carousel-cell" id="picTwo"></div>
                  <div class="carousel-cell" id="picThree"></div>
                </div>

                <!-- <img class="designerMockup" id="designerMockup" src="" alt=""> -->
            </div>

        </div>
        
        <script type="text/javascript" src="js/custom_behaviors InternalPage.js"></script>
